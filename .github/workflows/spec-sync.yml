name: Sync EasyTrans OpenAPI spec

# Weekly check of the OpenAPI spec published by EasyTrans. When it changed,
# opens (or updates) a pull request with the new spec, a readable diff and
# the result of the contract tests, which list the SDK work needed.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Fetch spec and diff
        id: sync
        run: |
          python scripts/sync_spec.py --summary spec-diff.md
          if git diff --quiet -- "EasyTrans Documentation/openapi.yaml"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Contract tests against the new spec
        if: steps.sync.outputs.changed == 'true'
        run: |
          set +e
          python -m pytest tests/test_spec_contract.py --no-cov -q -p no:cacheprovider > contract.txt 2>&1
          status=$?
          set -e
          {
            cat spec-diff.md
            echo
            if [ "$status" -eq 0 ]; then
              echo "### Contract tests: passed"
              echo
              echo "The SDK already handles everything in the new spec."
            else
              echo "### Contract tests: FAILED, SDK changes needed"
              echo
              echo '```'
              grep -E "AssertionError|^FAILED|passed|failed" contract.txt | cut -c1-400
              echo '```'
            fi
          } > pr-body.md
          # GitHub caps PR bodies at 65536 characters.
          head -c 60000 pr-body.md > pr-body.trimmed.md

      - name: Open pull request
        if: steps.sync.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: spec-sync/easytrans-openapi
          delete-branch: true
          add-paths: "EasyTrans Documentation/openapi.yaml"
          commit-message: "chore(spec): sync EasyTrans OpenAPI spec"
          title: "EasyTrans OpenAPI spec changed"
          body-path: pr-body.trimmed.md
          labels: spec-sync
