  /v1/invoices:
    get:
      summary: 'Get list of invoices'
      operationId: getListOfInvoices
      description: "This endpoint returns all invoices for the authenticated customer or branch account.<br>\nThe result can be filtered by the filter options below. A combination of filters is also allowed.<br>\nFor some filters you can filter on multiple values by separating them with a comma.<br>\nFor example: <b><code>?filter[invoiceNo]=1,2,3</code></b><br>\nYou can also use the following operators on any integer or date type filter, by placing them behind the name of the filter:<br>\n<b><code>[gte]</code></b> = Greater than or equal<br>\n<b><code>[gt]</code></b> = Greater than<br>\n<b><code>[lte]</code></b> = Less than or equal<br>\n<b><code>[lt]</code></b> = Less than<br>\n<b><code>[neq]</code></b> = Not equal<br>\nFor example: <b><code>?filter[invoiceDate][gte]=2024-05-30</code></b> returns all invoices with an invoice date starting from this date.<br>\nOperators can also be combined.<br>\nFor example: <b><code>?filter[invoiceNo][gte]=1000&filter[invoiceNo][lt]=2000</code></b> returns all invoices with and invoice number between 1000 and 1999.<br>\nThe result is paginated by 100 invoices."
      parameters:
        -
          in: query
          name: filter
          description: 'Fields to filter by'
          example: []
          required: false
          schema:
            type: object
            description: 'Fields to filter by'
            example: []
            properties: {  }
        -
          in: query
          name: filter.invoiceId
          description: 'Filter by invoice Id. The invoice Id is an internal number that can be used to retrieve the orders that correspond to an invoice.<br>Multiple invoices can be retrieved by separating the invoice Id with a comma or by using operators.<br>Use the [gte] operator to retrieve all invoices starting from this invoice Id <b><code>?filter[invoiceId][gte]=284</code></b>.'
          example: 284
          required: false
          schema:
            type: integer
            description: 'Filter by invoice Id. The invoice Id is an internal number that can be used to retrieve the orders that correspond to an invoice.<br>Multiple invoices can be retrieved by separating the invoice Id with a comma or by using operators.<br>Use the [gte] operator to retrieve all invoices starting from this invoice Id <b><code>?filter[invoiceId][gte]=284</code></b>.'
            example: 284
        -
          in: query
          name: filter.invoiceNo
          description: 'Filter by invoice number. Note: This is the part of the invoice number without the prefix<br>Multiple invoices can be retrieved by separating the invoice numbers with a comma or by using operators.<br>Use the [gte] operator to retrieve all invoices starting from this invoice number <b><code>?filter[invoiceNo][gte]=20240123</code></b>.'
          example: 20240123
          required: false
          schema:
            type: integer
            description: 'Filter by invoice number. Note: This is the part of the invoice number without the prefix<br>Multiple invoices can be retrieved by separating the invoice numbers with a comma or by using operators.<br>Use the [gte] operator to retrieve all invoices starting from this invoice number <b><code>?filter[invoiceNo][gte]=20240123</code></b>.'
            example: 20240123
        -
          in: query
          name: filter.invoiceNoPrefix
          description: 'Filter by invoice number prefix. Note: This is the part before the invoice number.<br>Multiple prefixes can be retrieved by separating the values with a comma or by using operators (only when numeric).'
          example: null
          required: false
          schema:
            type: string
            description: 'Filter by invoice number prefix. Note: This is the part before the invoice number.<br>Multiple prefixes can be retrieved by separating the values with a comma or by using operators (only when numeric).'
            example: null
        -
          in: query
          name: filter.customerNo
          description: 'Filter by customer number (only with branch account).<br>Multiple customer numbers can be retrieved by separating the numbers with a comma or by using operators.'
          example: 2001
          required: false
          schema:
            type: integer
            description: 'Filter by customer number (only with branch account).<br>Multiple customer numbers can be retrieved by separating the numbers with a comma or by using operators.'
            example: 2001
        -
          in: query
          name: filter.invoiceDate
          description: 'Filter by invoice date.<br>Use the [gte] operator to retrieve all invoices starting from this date <b><code>?filter[invoiceDate][gte]=2024-05-30</code></b>.'
          example: '2024-05-30'
          required: false
          schema:
            type: string
            description: 'Filter by invoice date.<br>Use the [gte] operator to retrieve all invoices starting from this date <b><code>?filter[invoiceDate][gte]=2024-05-30</code></b>.'
            example: '2024-05-30'
        -
          in: query
          name: include_customer
          description: 'If true, returns the customer details.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'If true, returns the customer details.'
            example: true
        -
          in: query
          name: include_invoice
          description: 'If true, returns the base64 encoded PDF invoice.'
          example: false
          required: false
          schema:
            type: boolean
            description: 'If true, returns the base64 encoded PDF invoice.'
            example: false
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: invoice
                      id: 284
                      attributes:
                        invoiceId: 284
                        invoiceNo: 20240123
                        invoiceNoPrefix: ''
                        customerNo: 2001
                        invoiceDate: '2024-05-30'
                        amountExclVat: '246.30'
                        amountInclVat: '298.02'
                        currency: ''
                        paymentMethod: ''
                        onlinePaymentStatus: ''
                        discountPercentage: 0
                        sentDate: '2024-05-30'
                        paid: true
                        paidDate: '2025-08-09'
                        exported: false
                        externalId: ''
                        customer:
                          type: customer
                          id: 2001
                          createdAt: '2023-12-01T10:05:01+01:00'
                          updatedAt: '2023-12-01T10:05:01+01:00'
                          attributes:
                            customerNo: 2001
                            companyName: 'EasyTrans Software B.V.'
                            businessAddress:
                              address: Keulenstraat
                              houseno: '1'
                              address2: 'Kantoor A3.5'
                              postcode: '7418 ET'
                              city: DEVENTER
                              country: NL
                            mailingAddress:
