      description: "This endpoint returns all customers for the authenticated branch.<br>\nThe result can be filtered by the filter options below. A combination of filters is also allowed.<br>\nFor some filters you can filter on multiple values by separating them with a comma.<br>\nFor example: <b><code>?filter[customerNo]=1,2,3</code></b><br>\nYou can also use the following operators on any integer or date type filter, by placing them behind the name of the filter:<br>\n<b><code>[gte]</code></b> = Greater than or equal<br>\n<b><code>[gt]</code></b> = Greater than<br>\n<b><code>[lte]</code></b> = Less than or equal<br>\n<b><code>[lt]</code></b> = Less than<br>\n<b><code>[neq]</code></b> = Not equal<br>\nFor example: <b><code>?filter[createdAt][gte]=2023-12-01</code></b> returns all customers created since this date.<br>\nOperators can also be combined.<br>\nFor example: <b><code>?filter[customerNo][gte]=1000&filter[customerNo][lt]=2000</code></b> returns all customers between 1000 and 1999.<br>\nThe result can be sorted by the sort names below.<br>\nThe result is paginated by 100 customers.<br>\nThis endpoint can only be used with branch accounts, not with customer accounts."
      parameters:
        -
