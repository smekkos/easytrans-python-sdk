    url: 'https://YOUR_SERVER/YOUR_ENVIRONMENT/api'
tags:
  -
    name: 'Orders (Customer or branch account)'
    description: ''
  -
    name: 'Products (Customer or branch account)'
    description: ''
  -
    name: 'Substatuses (Customer or branch account)'
    description: ''
  -
    name: 'PackageTypes (Customer or branch account)'
    description: ''
  -
    name: 'VehicleTypes (Customer or branch account)'
    description: ''
  -
