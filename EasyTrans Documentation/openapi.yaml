    put:
      summary: 'Update the specified order'
      operationId: updateTheSpecifiedOrder
      description: "This endpoint updates the specified order and its destinations, goods and rates for the authenticated branch.<br>\nThis endpoint can only be used with branch accounts, not with customer accounts.<br>\nOnly the body parameters below can be updated.<br>\nSome elements can only be updated if the order is open for editing (not checked or invoiced).<br>\nThe response contains the updated order.<br><br>\n<strong>Update destinations, goods and rates</strong><br>\nA destination can be updated by providing the addressId (or stopNo) together with the body parameters that need to be changed.<br>\nA goods line can be updated by providing the packageId (or packageNo) together with the body parameters that need to be changed.<br>\nSales and purchase rates can be updated by providing the rateNo and the ratePerUnit.<br>\nThe destinations, goods and rates properties expect an array, so multiple destinations/goods/rates can be updated in one request.<br>\nSee the example request, how to edit a destination, goods line or rate.<br>"
