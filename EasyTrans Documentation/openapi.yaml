      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  description: 'Sets the new status for this order.<br>If the transport is finished, but the goods could not be delivered, use the carrierNotes field to specify a undeliverable reason.'
                  example: in-progress
                  enum:
                    - in-progress
                    - finished
                destinations:
                  type: array
                  description: ''
                  example:
                    - []
                  items:
                    type: object
                    properties:
                      addressId:
                        type: integer
                        description: 'Provide either this addressId or a stopNo to update this destination with the body parameters below.<br><b>Please note:</b><br>- This property cannot be updated and is only used to update the specified destination.<br>- The use of addressId is preferred over stopNo, since the stopNo of a destination changes if destinations are inserted, removed or if their sequence is changed. The addressId always corresponds to the same destination, regardless of the sequence they are placed in.'
                        example: 28417
                      stopNo:
                        type: integer
                        description: 'Provide either this stopNo or an addressId to update this destination with the body parameters below.<br><b>Please note:</b><br>- This property cannot be updated and is only used to update the specified destination.<br>- The use of addressId is preferred over stopNo, since the stopNo of a destination changes if destinations are inserted, removed or if their sequence is changed. The addressId always corresponds to the same destination, regardless of the sequence they are placed in.'
                        example: 2
                      date:
                        type: string
                        description: 'Sets the new date for this destination in the format yyyy-mm-dd. Must be a valid date in the format <code>Y-m-d</code>. Must be a date after <code>-5 year</code>.'
                        example: '2025-12-01'
                        nullable: true
                      deliveryTime:
                        type: string
                        description: 'Sets the new delivery time for this destination in the format hh:mm (use local time). Must be a valid date in the format <code>H:i</code>.'
                        example: '16:48'
                        nullable: true
                      departureTime:
                        type: string
                        description: 'Sets the new departure time for this destination in the format hh:mm (use local time). Must be a valid date in the format <code>H:i</code>.'
                        example: '17:05'
                        nullable: true
                      deliveryName:
                        type: string
                        description: 'Sets the name of the person or department that signed for delivery. Must not be greater than 100 characters.'
                        example: 'Mr. Johnson'
                        nullable: true
                      carrierNotes:
                        type: string
                        description: 'Adds a new carrier note to this destination.'
                        example: 'Delivered at the neighbours'
                        nullable: true
                      base64EncodedSignature:
                        type: string
                        description: 'Adds a new base 64 encoded signature to this destination. The signature must be an image with a maximum size of 512KB.'
                        example: ''
                      documentName:
                        type: string
                        description: 'The name of the document that is being uploaded in the base64EncodedDocument field. Must not be greater than 255 characters.'
                        example: 'CMR 12345'
                        nullable: true
                      base64EncodedDocument:
                        type: string
                        description: 'Adds a new base 64 encoded Proof Of Delivery document to this destination. The document must be a PDF with a maximum size of 20MB.'
                        example: ''
              required:
                - status
                - destinations
    parameters:
      -
        in: path
        name: orderNo
        description: 'The order number.'
        example: 35558
        required: true
        schema:
          type: integer
