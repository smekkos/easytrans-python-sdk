    put:
      summary: 'Update the specified order for a carrier'
      operationId: updateTheSpecifiedOrderForACarrier
      description: "This endpoint updates the specified order and its destinations for the authenticated carrier.<br>\nIt is generally used to let a carrier sign-off an order and provide POD information.<br>\nOnly the body parameters below can be updated.<br>\nOnly orders that are open for editing can be updated (finished orders cannot be changed).<br>\nThe response contains the updated order.<br><br>\n<strong>Update destinations</strong><br>\nA destination can be updated by providing the addressId (or stopNo) together with the body parameters that need to be changed.<br>\nFor a simple order with only one pickup and one delivery address, stopNo 2 is updated to sign-off an order. StopNo 1 can be updated to inform the carrier the goods have been loaded.<br>\nFor a multi stop order, several destinations need to be updated in order to update the POD information for each location.<br>\nThe destinations property expects an array. This allows updating of multiple destinations in one request.<br>\nSee the example request on how to edit a destination.<br>"
