  '/v1/orders/{orderNo}':
    get:
      summary: 'Get order by order number'
      operationId: getOrderByOrderNumber
      description: 'This endpoint returns the specified order for the authenticated customer or branch.'
      parameters:
        -
          in: query
          name: include_customer
          description: 'If true, returns the customer details.'
          example: false
          required: false
          schema:
            type: boolean
            description: 'If true, returns the customer details.'
            example: false
        -
          in: query
          name: include_carrier
          description: 'If true, returns the carrier details (only with branch account).'
          example: false
          required: false
          schema:
            type: boolean
            description: 'If true, returns the carrier details (only with branch account).'
            example: false
        -
          in: query
          name: include_track_history
          description: 'If true, returns an array with the available order Track & Trace history.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'If true, returns an array with the available order Track & Trace history.'
            example: true
        -
          in: query
          name: include_sales_rates
          description: 'If true, returns an array with the sales rates.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'If true, returns an array with the sales rates.'
            example: true
        -
