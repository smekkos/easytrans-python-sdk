      summary: 'Get list of carriers (branch accounts only)'
      operationId: getListOfCarriersbranchAccountsOnly
      description: "This endpoint returns all carriers for the authenticated branch.<br>\nThe result can be filtered by the filter options below. A combination of filters is also allowed.<br>\nFor some filters you can filter on multiple values by separating them with a comma.<br>\nFor example: <b><code>?filter[carrierNo]=1,2,3</code></b><br>\nYou can also use the following operators on any integer or date type filter, by placing them behind the name of the filter:<br>\n<b><code>[gte]</code></b> = Greater than or equal<br>\n<b><code>[gt]</code></b> = Greater than<br>\n<b><code>[lte]</code></b> = Less than or equal<br>\n<b><code>[lt]</code></b> = Less than<br>\n<b><code>[neq]</code></b> = Not equal<br>\nFor example: <b><code>?filter[createdAt][gte]=2023-12-01</code></b> returns all carriers created since this date.<br>\nOperators can also be combined.<br>\nFor example: <b><code>?filter[carrierNo][gte]=1000&filter[carrierNo][lt]=2000</code></b> returns all carriers between 1000 and 1999.<br>\nThe result can be sorted by the sort names below.<br>\nThe result is paginated by 100 carriers.<br>\nThis endpoint can only be used with main branch accounts."
      parameters:
        -
          in: query
          name: filter
          description: 'Fields to filter by'
          example: []
          required: false
          schema:
            type: object
            description: 'Fields to filter by'
            example: []
            properties: {  }
        -
          in: query
          name: filter.carrierNo
          description: 'Filter by carrier number.<br>Multiple carriers can be retrieved by separating the carrier numbers with a comma or by using operators.<br>Use the [gte] operator to retrieve all carriers starting from this carrier number <b><code>?filter[carrier][gte]=1234</code></b>.'
