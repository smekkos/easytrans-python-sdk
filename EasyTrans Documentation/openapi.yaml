  /v1/carrier/orders:
    get:
      summary: 'Get list of orders'
      operationId: getListOfOrders
      description: "This endpoint returns all orders for the authenticated carrier.<br>\nThe result can be filtered by the filter options below. A combination of filters is also allowed.<br>\nFor some filters you can filter on multiple values by separating them with a comma.<br>\nFor example: <b><code>?filter[orderNo]=1,2,3</code></b><br>\nYou can also use the following operators on any integer or date type filter, by placing them behind the name of the filter:<br>\n<b><code>[gte]</code></b> = Greater than or equal<br>\n<b><code>[gt]</code></b> = Greater than<br>\n<b><code>[lte]</code></b> = Less than or equal<br>\n<b><code>[lt]</code></b> = Less than<br>\n<b><code>[neq]</code></b> = Not equal<br>\nFor example: <b><code>?filter[date][gte]=2023-12-01</code></b> returns all orders with an order date starting from this date.<br>\nOperators can also be combined.<br>\nFor example: <b><code>?filter[orderNo][gte]=1000&filter[orderNo][lt]=2000</code></b> returns all orders between 1000 and 1999.<br>\nThe result can be sorted by the sort names below.<br>\nThe result is paginated by 100 orders."
      parameters:
        -
          in: query
          name: filter
          description: 'Fields to filter by'
          example: []
          required: false
          schema:
            type: object
            description: 'Fields to filter by'
            example: []
            properties: {  }
        -
          in: query
          name: filter.orderNo
          description: 'Filter by order number.<br>Multiple orders can be retrieved by separating the order numbers with a comma or by using operators.<br>Use the [gte] operator to retrieve all orders starting from this order number <b><code>?filter[orderNo][gte]=1234</code></b>.'
          example: 35558
          required: false
          schema:
            type: integer
            description: 'Filter by order number.<br>Multiple orders can be retrieved by separating the order numbers with a comma or by using operators.<br>Use the [gte] operator to retrieve all orders starting from this order number <b><code>?filter[orderNo][gte]=1234</code></b>.'
            example: 35558
        -
          in: query
          name: filter.date
          description: 'Filter by order date.<br>Use the [gte] operator to retrieve all orders starting from this date <b><code>?filter[date][gte]=2023-12-01</code></b>.'
          example: '2023-12-01'
          required: false
          schema:
            type: string
            description: 'Filter by order date.<br>Use the [gte] operator to retrieve all orders starting from this date <b><code>?filter[date][gte]=2023-12-01</code></b>.'
            example: '2023-12-01'
        -
          in: query
          name: filter.createdAt
          description: 'Filter by created at timestamp.<br>Use the [gte] operator to retrieve all orders that where created since this timestamp <b><code>?filter[createdAt][gte]=2023-12-01T10:05:01</code></b>.'
          example: '2023-12-01T10:05:01'
          required: false
          schema:
            type: string
            description: 'Filter by created at timestamp.<br>Use the [gte] operator to retrieve all orders that where created since this timestamp <b><code>?filter[createdAt][gte]=2023-12-01T10:05:01</code></b>.'
            example: '2023-12-01T10:05:01'
        -
          in: query
          name: filter.updatedAt
          description: 'Filter by updated at timestamp.<br>Use the [gte] operator to retrieve all orders that where last updated since this timestamp <b><code>?filter[updatedAt][gte]=2023-12-01T10:05:01</code></b>.'
          example: '2023-12-01T10:05:01'
          required: false
          schema:
            type: string
            description: 'Filter by updated at timestamp.<br>Use the [gte] operator to retrieve all orders that where last updated since this timestamp <b><code>?filter[updatedAt][gte]=2023-12-01T10:05:01</code></b>.'
            example: '2023-12-01T10:05:01'
        -
          in: query
          name: filter.status
          description: 'Filter by order status.<br>Possible values for carrier accounts are: in-progress, finished.'
          example: in-progress
          required: false
          schema:
            type: string
            description: 'Filter by order status.<br>Possible values for carrier accounts are: in-progress, finished.'
            example: in-progress
        -
          in: query
          name: sort
          description: 'Sort the response.<br>The result can be sorted by the following property names: orderNo, date (also includes time), createdAt, updatedAt, status.<br>Sorting is ascending by default and can be reversed by adding a hyphen (-) to the start of the property name.<br>You can sort by multiple properties by separating them with a comma <b><code>?sort=status,-date</code></b>.'
          example: 'status,-date'
          required: false
          schema:
            type: string
            description: 'Sort the response.<br>The result can be sorted by the following property names: orderNo, date (also includes time), createdAt, updatedAt, status.<br>Sorting is ascending by default and can be reversed by adding a hyphen (-) to the start of the property name.<br>You can sort by multiple properties by separating them with a comma <b><code>?sort=status,-date</code></b>.'
            example: 'status,-date'
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      type: order
                      id: 35558
                      createdAt: '2023-12-01T10:05:01+01:00'
